<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>POTENZIALE 1.3.1</title><style>:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--dark:#111827;--ok:#16803c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;padding:12px 14px 90px}.install{width:100%;border:0;background:var(--dark);color:#fff;border-radius:18px;padding:15px;font-weight:800;margin-bottom:10px}.top{margin-bottom:10px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0;color:var(--muted)}.actions,.nav,.grid,.kpis{display:grid;gap:8px}.actions{grid-template-columns:repeat(3,1fr)}.nav{grid-template-columns:repeat(4,1fr);margin:12px 0}.actions button,.nav button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;font-weight:750}.nav .active{background:var(--dark);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin:12px 0}.badge{display:inline-block;background:#eef2ff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}.hero h2{font-size:34px;margin:8px 0}.date,.muted{color:var(--muted)}.task{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.check{width:52px;height:52px;border:2px solid #aeb4bc;border-radius:12px;background:#fff;font-size:24px}.check.done{background:#eaf7ef;border-color:var(--ok);color:var(--ok)}.task strong{display:block;font-size:18px}.task small{color:var(--muted)}.progressbar{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progressbar i{display:block;height:100%;background:var(--dark);border-radius:inherit}.kpis{grid-template-columns:repeat(2,1fr)}.kpi{background:#f8fafc;border-radius:16px;padding:13px}.kpi b{display:block;font-size:25px}.kpi span{font-size:12px;color:var(--muted)}.grid{grid-template-columns:repeat(2,1fr)}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.primary{border:0;background:var(--dark);color:#fff;border-radius:14px;padding:12px 16px;font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.score{font-size:40px;font-weight:900}.area{margin:10px 0}.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border:0;border-radius:50%;background:var(--dark);color:#fff;font-size:28px}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 15px;border-radius:999px;display:none}@media(max-width:520px){.nav{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><button id="installBtn" class="install">📲 Installa POTENZIALE sul telefono</button><div class="top"><div class="brand"><h1>POTENZIALE 1.3.1</h1><p>Smettere di sprecare il mio potenziale.</p></div></div><div class="actions"><button id="backupBtn">Backup</button><button id="restoreBtn">Ripristina</button><button id="resetBtn">Reset</button><input id="fileInput" type="file" accept="application/json" hidden></div><nav class="nav" id="nav"></nav><main id="content"></main></div><button class="fab" id="addBtn">+</button><div class="toast" id="toast"></div><script>
const VERSION='1.3.1',KEY='potenziale_v131';const BANK={Disciplina:[['Fai 15 minuti di ordine senza telefono',15],['Prepara domani in 5 minuti',5],['Completa una piccola cosa rimandata',10]],Corpo:[['Fai 10 minuti di movimento',10],['Cammina almeno 15 minuti',15],['Fai stretching per 8 minuti',8]],Economia:[['Controlla le spese di ieri',5],['Segna una spesa o un’entrata',3],['Controlla una voce del budget',5]],Carriera:[['Impara una cosa utile per il tuo lavoro',15],['Cerca una posizione interessante',15],['Migliora una riga del CV',10]],Crescita:[['Scrivi 5 righe sul tuo futuro',5],['Leggi 5 pagine',15],['Scrivi una decisione che stai evitando',5]],Ambiente:[['Sistema una zona della casa',10],['Butta o dona 5 cose inutili',10],['Sistema una superficie per 10 minuti',10]],Relazioni:[['Dedica 10 minuti a una persona importante',10],['Scrivi a qualcuno che non senti da un po’',5],['Fai una telefonata senza multitasking',10]]};const PAGES={oggi:'🏠 Oggi',task:'☑️ Task',progressi:'📊 Progressi',economia:'💰 Economia'};let page='oggi',deferredPrompt=null;
function dk(d=new Date()){return d.toISOString().slice(0,10)}function addDays(k,n){let d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dk(d)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function def(){return{schema:13,version:VERSION,tasks:{},history:{},economy:{income:0,expenses:0,goal:5000}}}function load(){try{return Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return def()}}let state=load();function save(){state.schema=13;state.version=VERSION;localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',1700)}function recent(){let c=0,total=0,days=0,k=dk();for(let i=0;i<14;i++){let a=state.tasks[k]||[],d=a.filter(x=>x.done).length;c+=d;total+=a.length;if(d)days++;k=addDays(k,-1)}return{c,total,days}}function plan(){let k=dk(),recentCats=new Set();let d=k;for(let i=0;i<4;i++){(state.tasks[d]||[]).forEach(t=>recentCats.add(t.cat));d=addDays(d,-1)}let cats=Object.keys(BANK).sort((a,b)=>(recentCats.has(a)?1:0)-(recentCats.has(b)?1:0));return cats.slice(0,3).map((cat,i)=>{let x=BANK[cat][(new Date().getDate()+i)%BANK[cat].length];return{id:crypto.randomUUID(),title:x[0],cat,minutes:x[1],done:false}})}function ensure(){let k=dk();if(!Array.isArray(state.tasks[k])||!state.tasks[k].length){state.tasks[k]=plan();save()}}function score(){let r=recent(),s=20+Math.min(45,r.c*5)+Math.min(20,r.days*3);if(Number(state.economy.income)>0)s+=5;if(Number(state.economy.expenses)>0)s+=5;return Math.min(100,s)}function taskHTML(t){return`<div class="task"><button class="check ${t.done?'done':''}" data-task="${t.id}">${t.done?'✓':''}</button><div><strong>${esc(t.title)}</strong><small>${esc(t.cat)} · ${t.minutes} min</small></div></div>`}function renderNav(){nav.innerHTML=Object.entries(PAGES).map(([k,v])=>`<button class="${page===k?'active':''}" data-page="${k}">${v}</button>`).join('')}function render(){ensure();renderNav();content.innerHTML={oggi:today,tasks,progress,economy}[page]();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>toggle(b.dataset.task));bind()}function today(){let t=state.tasks[dk()]||[],done=t.filter(x=>x.done).length,p=t.length?done/t.length*100:0;return`<section class="card"><span class="badge">LIVELLO 0 • RIACCENSIONE</span><h2>Oggi.</h2><div class="date">${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h3>🎯 Le tue task</h3>${t.map(taskHTML).join('')}<div class="row"><b>Progresso</b><b>${done}/${t.length}</b></div><div class="progressbar"><i style="width:${p}%"></i></div></section><section class="card"><h3>🔥 Momentum</h3><div class="score">${recent().days}</div><div class="muted">giorni attivi negli ultimi 14</div><h3>📊 Potenziale Score</h3><div class="score">${score()}/100</div></section>`}function tasks(){let t=state.tasks[dk()]||[];return`<section class="card"><div class="row"><h2>☑️ Task</h2><button class="primary" id="regen">Nuovo piano</button></div><p class="muted">Il motore adattivo riduce la ripetizione delle aree.</p>${t.map(taskHTML).join('')}</section><section class="card"><h3>➕ Aggiungi una task</h3><div class="grid"><div class="field"><label>Task</label><input id="newTitle" placeholder="Es. 20 minuti di studio"></div><div class="field"><label>Area</label><select id="newCat">${Object.keys(BANK).map(x=>`<option>${x}</option>`).join('')}</select></div></div><br><button class="primary" id="saveTask">Aggiungi</button></section>`}function progress(){let r=recent(),cats={};Object.values(state.tasks).flat().forEach(t=>{cats[t.cat]??={d:0,n:0};cats[t.cat].n++;if(t.done)cats[t.cat].d++});return`<section class="card"><h2>📊 Progressi</h2><div class="kpis"><div class="kpi"><b>${score()}/100</b><span>Score</span></div><div class="kpi"><b>${r.c}</b><span>Completate · 14 giorni</span></div><div class="kpi"><b>${r.days}</b><span>Giorni attivi</span></div><div class="kpi"><b>${r.total?Math.round(r.c/r.total*100):0}%</b><span>Completamento</span></div></div></section><section class="card"><h3>🎯 Aree</h3>${Object.entries(cats).map(([c,v])=>`<div class="area"><div class="row"><b>${esc(c)}</b><span>${v.d}/${v.n}</span></div><div class="progressbar"><i style="width:${Math.round(v.d/v.n*100)}%"></i></div></div>`).join('')}</section>`}function economy(){let i=+state.economy.income||0,e=+state.economy.expenses||0,g=+state.economy.goal||0,s=i-e,p=g?Math.max(0,Math.min(100,s/g*100)):0;return`<section class="card"><h2>💰 Economia personale</h2><p class="muted">Misurare prima di migliorare.</p><div class="grid"><div class="field"><label>Entrate mensili (€)</label><input id="income" type="number" value="${i}"></div><div class="field"><label>Spese mensili (€)</label><input id="expenses" type="number" value="${e}"></div><div class="field"><label>Obiettivo risparmio (€)</label><input id="goal" type="number" value="${g}"></div><div class="field"><label>Risparmio</label><input value="${s.toFixed(2)}" disabled></div></div><br><button class="primary" id="saveMoney">Salva economia</button></section><section class="card"><div class="row"><b>Risparmio verso obiettivo</b><b>${Math.round(p)}%</b></div><div class="progressbar"><i style="width:${p}%"></i></div><p class="muted">Risparmio stimato mensile: € ${s.toFixed(2)}</p></section>`}function toggle(id){let t=(state.tasks[dk()]||[]).find(x=>x.id===id);if(!t)return;t.done=!t.done;state.history[dk()]={completed:(state.tasks[dk()]||[]).filter(x=>x.done).length};save();render();toast(t.done?'Task completata ✓':'Task riaperta')}function bind(){let r=document.getElementById('regen');if(r)r.onclick=()=>{state.tasks[dk()]=plan();save();render();toast('Nuovo piano creato')};let s=document.getElementById('saveTask');if(s)s.onclick=()=>{let title=newTitle.value.trim();if(!title)return toast('Scrivi una task');state.tasks[dk()].push({id:crypto.randomUUID(),title,cat:newCat.value,minutes:10,done:false});save();render();toast('Task aggiunta')};let m=document.getElementById('saveMoney');if(m)m.onclick=()=>{state.economy.income=+income.value||0;state.economy.expenses=+expenses.value||0;state.economy.goal=+goal.value||0;save();render();toast('Economia salvata')}}backupBtn.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='POTENZIALE_backup_'+dk()+'.json';a.click();toast('Backup creato')};restoreBtn.onclick=()=>fileInput.click();fileInput.onchange=async e=>{try{state=Object.assign(def(),JSON.parse(await e.target.files[0].text()));save();render();toast('Ripristino completato')}catch{toast('Backup non valido')}};resetBtn.onclick=()=>{if(confirm('Cancellare tutti i dati locali?')){state=def();ensure();render();toast('Dati azzerati')}};addBtn.onclick=()=>{page='task';render();setTimeout(()=>newTitle?.focus(),50)};installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else toast('Usa il menu del browser → Installa app')};addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));ensure();render();</script></body></html>
