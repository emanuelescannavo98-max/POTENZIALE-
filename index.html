<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><meta name="description" content="POTENZIALE — sistema personale per task, progresso, economia e continuità.">
<link rel="manifest" href="manifest.json"><title>POTENZIALE 1.3</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--border:#e5e7eb;--dark:#111827;--soft:#f8fafc;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1100px;margin:auto;padding:18px 18px 96px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.08em}.mission{font-size:12px;color:var(--muted)}button{border:0;border-radius:12px;padding:10px 13px;cursor:pointer;font-weight:750;color:inherit;background:#fff}button:active{transform:scale(.98)}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px;padding-bottom:2px}.nav button{border:1px solid var(--border);white-space:nowrap}.nav .active{background:var(--dark);color:#fff}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:17px;box-shadow:0 4px 18px #00000008}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}h1,h2,h3,p{margin-top:0}.hero h1{font-size:34px;margin-bottom:5px}.muted{color:var(--muted)}.big{font-size:30px;font-weight:900}.xl{font-size:42px;font-weight:950}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--dark);border-radius:99px;transition:width .25s ease}.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.task:last-child{border-bottom:0}.check{width:44px;height:44px;min-width:44px;border:2px solid #9ca3af;border-radius:10px;background:#fff;padding:0}.check.done{background:var(--dark);color:#fff}.task-title{flex:1}.doneText{text-decoration:line-through;color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px;font-weight:800}.badge.dark{background:#e5e7eb}.badge.ok{background:#dcfce7}.badge.warn{background:#fef3c7}.money{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.pillar{padding:12px;background:var(--soft);border-radius:14px}.small{font-size:12px}.input{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;margin:5px 0 10px;font:inherit}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.positive{color:var(--ok)}.negative{color:var(--bad)}.empty{padding:20px;text-align:center;color:var(--muted)}.fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;background:var(--dark);color:#fff;font-size:24px;z-index:5}.install{display:none;background:var(--dark);color:#fff;border-radius:14px;padding:11px 13px;font-weight:800;margin-bottom:14px;width:100%}.install.show{display:block}.safe{padding-bottom:env(safe-area-inset-bottom)}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{background:var(--soft);padding:12px;border-radius:14px}.timeline{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:9px 5px;border-radius:10px;background:var(--soft);text-align:center;font-size:11px}.day.good{background:#dcfce7}.day.partial{background:#fef3c7}.day.today{outline:2px solid var(--dark)}.hint{padding:12px;border-radius:14px;background:#f8fafc;border:1px dashed #cbd5e1}.danger{color:var(--bad)}hr{border:0;border-top:1px solid var(--border);margin:20px 0}
@media(max-width:760px){.s8,.s6,.s4{grid-column:span 12}.pillars,.formgrid{grid-template-columns:1fr}.hero h1{font-size:28px}.kpis{grid-template-columns:1fr 1fr}.timeline{grid-template-columns:repeat(7,1fr)}.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%;display:flex;overflow:auto}.top-actions button{flex:1;white-space:nowrap}.fab{bottom:calc(22px + env(safe-area-inset-bottom))}}
</style></head>
<body>
<div class="app safe"><button id="installBtn" class="install">📲 Installa POTENZIALE sul telefono</button>
<div class="top"><div><div class="brand">POTENZIALE 1.3</div><div class="mission">Smettere di sprecare il mio potenziale.</div></div><div class="top-actions" style="display:flex;gap:7px"><button onclick="exportData()">Backup</button><button onclick="importData()">Ripristina</button><button onclick="resetData()">Reset</button></div></div>
<div class="nav" id="nav"></div><main id="content"></main></div><button class="fab" onclick="quickAdd()">+</button>
<script>
const VERSION="1.3.0", KEY="potenziale_v13", OLD_KEY="potenziale_v12";
const today=()=>dateKey(new Date());
const defaultState=()=>({schema:13,profile:{name:"Emanuele",mission:"Smettere di sprecare il mio potenziale.",level:0},tasks:[],openItems:["Chiamare il tecnico per il condizionatore","Sistemare Sanicomb"],transactions:[],checkins:[],goals:[{id:1,name:"Fondo emergenza",target:3000,current:0,cat:"Economia"},{id:2,name:"Primo patrimonio",target:10000,current:0,cat:"Economia"},{id:3,name:"Primo milione",target:1000000,current:0,cat:"Visione"}],metrics:{discipline:30,body:40,money:10,career:10,relations:40,environment:40,growth:30},monthly:{incomeTarget:0,expenseTarget:0,savingTarget:0}});
let state=loadState(), page="oggi";
const pages={oggi:"🏠 Oggi",task:"☑️ Task",progressi:"📊 Progressi",money:"💰 Economia",obiettivi:"🎯 Obiettivi",checkin:"🌙 Check-in",aperte:"📋 Aperte"};
function loadState(){let raw=localStorage.getItem(KEY);if(raw){try{return normalize(JSON.parse(raw))}catch{}}let old=localStorage.getItem(OLD_KEY);if(old){try{let s=JSON.parse(old);s.schema=13;s.monthly=s.monthly||{incomeTarget:0,expenseTarget:0,savingTarget:0};if(!s.tasks)s.tasks=[];s.tasks.forEach(t=>{if(t.date===today()&&["Sistema una zona della casa","Scrivi 5 righe sul tuo futuro","Cammina con il cane"].includes(t.title))t.auto=true});localStorage.setItem(KEY,JSON.stringify(s));return normalize(s)}catch{}}return defaultState()}
function normalize(s){const d=defaultState();return {...d,...s,profile:{...d.profile,...(s.profile||{})},metrics:{...d.metrics,...(s.metrics||{})},monthly:{...d.monthly,...(s.monthly||{})},tasks:Array.isArray(s.tasks)?s.tasks:[],transactions:Array.isArray(s.transactions)?s.transactions:[],checkins:Array.isArray(s.checkins)?s.checkins:[],goals:Array.isArray(s.goals)?s.goals:[],openItems:Array.isArray(s.openItems)?s.openItems:[]}}
function save(){state.schema=13;localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function dateObj(x){const [y,m,d]=x.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(x,n){const d=dateObj(x);d.setDate(d.getDate()+n);return dateKey(d)}
function tomorrow(){return addDays(today(),1)}
function prettyDate(x){return dateObj(x).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function go(p){page=p;render()}
function renderNav(){nav.innerHTML=Object.entries(pages).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join("")}

/* ===== Adaptive Daily Engine 1.3 ===== */
const PLAN_BANK={
 discipline:[["Fai 15 minuti di ordine senza telefono","Disciplina",15],["Completa una piccola cosa che stai rimandando","Disciplina",15],["Elimina o archivia 10 cose inutili dal telefono","Disciplina",10]],
 body:[["Fai 10 minuti di movimento","Corpo",10],["Cammina con il cane per almeno 20 minuti","Corpo",20],["Fai 20 minuti di attività fisica leggera","Corpo",20]],
 money:[["Controlla le spese di ieri","Economia",10],["Controlla il saldo e scegli una spesa da evitare","Economia",10],["Metti da parte anche solo 1€ per un obiettivo","Economia",5]],
 career:[["Impara una cosa utile per il tuo lavoro","Carriera",20],["Scrivi le 3 priorità della prossima settimana","Carriera",10],["Fai una piccola azione per aumentare il tuo reddito","Carriera",15]],
 growth:[["Scrivi 5 righe sul tuo futuro","Crescita",5],["Scrivi la prossima azione del tuo obiettivo principale","Crescita",10],["Leggi o studia per 15 minuti","Crescita",15]],
 environment:[["Sistema una zona della casa","Ambiente",10],["Sistema un cassetto o una superficie","Ambiente",10],["Prepara una zona della casa per domani","Ambiente",10]],
 relations:[["Dedica 10 minuti a una persona importante","Relazioni",10],["Manda un messaggio a una persona che vuoi sentire","Relazioni",5],["Fai una telefonata senza guardare il telefono mentre parli","Relazioni",10]]
};
const BASE_PLAN=["environment","growth","body"];
function recentStats(){const cutoff=addDays(today(),-6), tasks=state.tasks.filter(t=>t.date>=cutoff&&t.date<=today()), checks=state.checkins.slice(-7);return{completion:tasks.length?tasks.filter(t=>t.done).length/tasks.length:0,energy:checks.length?checks.reduce((a,x)=>a+x.energy,0)/checks.length:5,stress:checks.length?checks.reduce((a,x)=>a+x.stress,0)/checks.length:5}}
function adaptiveMode(){const s=recentStats();if(s.completion<.45||s.energy<=3||s.stress>=7)return"RIACCENSIONE";if(s.completion>.8&&s.energy>=6&&s.stress<=5)return"ESPANSIONE";return"STANDARD"}
function preferredPillars(){const s=recentStats(), keys=Object.keys(state.metrics);return keys.sort((a,b)=>state.metrics[a]-state.metrics[b])}
function dayIndex(x){const d=dateObj(x),start=new Date(d.getFullYear(),0,1);return Math.floor((d-start)/86400000)}
function chooseTask(pillar,offset){const bank=PLAN_BANK[pillar]||PLAN_BANK.growth;return bank[(dayIndex(today())+offset)%bank.length]}
function ensureDailyTasks(dateStr){if(state.tasks.some(t=>t.date===dateStr&&t.auto))return;let mode=adaptiveMode(), pillars=preferredPillars(), selected=[];
  if(mode==="RIACCENSIONE") selected=["environment","body","growth"];
  else if(mode==="ESPANSIONE") selected=[pillars[0]||"career",pillars[1]||"money",pillars[2]||"body"];
  else {const shift=dayIndex(dateStr)%7;selected=[BASE_PLAN[shift%3],BASE_PLAN[(shift+1)%3],pillars[0]||BASE_PLAN[(shift+2)%3]]}
  const seen=new Set();selected=selected.filter(x=>!seen.has(x)&&seen.add(x));while(selected.length<3)selected.push(BASE_PLAN[selected.length]);
  selected.slice(0,3).forEach((pillar,i)=>{const x=chooseTask(pillar,i);state.tasks.push({id:Number(dateStr.replaceAll("-","")+String(i+1).padStart(2,"0")),title:x[0],cat:x[1],mins:x[2],done:false,date:dateStr,auto:true,mode});});save()}
function taskRows(arr){return arr.length?arr.map(t=>`<div class="task"><button class="check ${t.done?'done':''}" onclick="toggleTask(${t.id})">${t.done?'✓':''}</button><div class="task-title ${t.done?'doneText':''}"><b>${esc(t.title)}</b><div class="small muted">${esc(t.cat)} · ${t.mins} min${t.auto?" · automatica":""}</div></div><button title="Elimina" onclick="deleteTask(${t.id})">⋯</button></div>`).join(""):"<div class='empty'>Nessuna task.</div>"}
function dailyPreview(dateStr){ensureDailyTasks(dateStr);const a=state.tasks.filter(t=>t.date===dateStr).slice(0,3);return taskRows(a)}
function pillarHTML(){const n={discipline:"🧠 Disciplina",body:"💪 Corpo",money:"💰 Economia",career:"💼 Carriera",relations:"❤️ Relazioni",environment:"🏠 Ambiente",growth:"🎯 Crescita"};return Object.entries(state.metrics).map(([k,v])=>`<div class="pillar"><div class="row"><b>${n[k]}</b><span>${v}</span></div><div class="progress"><div class="bar" style="width:${v}%"></div></div></div>`).join("")}
function momentum(){let streak=0,d=today();while(true){const a=state.tasks.filter(t=>t.date===d);if(!a.length||!a.some(t=>t.done))break;streak++;d=addDays(d,-1);if(streak>365)break}return streak}
function weekData(){let out=[];for(let i=6;i>=0;i--){const d=addDays(today(),-i),a=state.tasks.filter(t=>t.date===d),done=a.filter(t=>t.done).length;out.push({d,done,total:a.length})}return out}
function score(){const w=weekData(),completion=w.reduce((a,x)=>a+(x.total?x.done/x.total:0),0)/7;const pillar=Object.values(state.metrics).reduce((a,b)=>a+b,0)/7;return Math.round(completion*50+pillar*.5)}

function home(){ensureDailyTasks(today());ensureDailyTasks(tomorrow());const ts=state.tasks.filter(t=>t.date===today()),done=ts.filter(t=>t.done).length,prog=pct(done,ts.length),mode=adaptiveMode(),s=recentStats(),mom=momentum(),sc=score();const ins=state.transactions.filter(x=>x.type==="in").reduce((a,x)=>a+x.amount,0),out=state.transactions.filter(x=>x.type==="out").reduce((a,x)=>a+x.amount,0);
return `<div class="grid"><section class="card s8 hero"><span class="badge">LIVELLO 0 · ${mode}</span><h1>Oggi.</h1><p class="muted">${prettyDate(today())}</p><h3>🎯 Le tue task</h3>${taskRows(ts)}<div style="margin-top:15px"><div class="row"><b>Progresso</b><b>${done}/${ts.length}</b></div><div class="progress"><div class="bar" style="width:${prog}%"></div></div></div></section>
<section class="card s4"><h3>🔥 Momentum</h3><div class="xl">${mom}</div><p class="muted">giorni consecutivi con almeno una task completata.</p><h3>📊 Potenziale Score</h3><div class="big">${sc}/100</div><p class="small muted">Ultimi 7 giorni + stato dei pilastri.</p></section>
<section class="card s6"><h3>📅 Domani</h3><p class="muted">${prettyDate(tomorrow())}</p>${dailyPreview(tomorrow())}<button onclick="go('task')">Vedi tutte le task →</button></section>
<section class="card s6"><h3>🧠 Piano adattivo</h3><div class="kpis"><div class="kpi"><div class="small muted">Energia</div><b>${s.energy.toFixed(1)}/10</b></div><div class="kpi"><div class="small muted">Stress</div><b>${s.stress.toFixed(1)}/10</b></div><div class="kpi"><div class="small muted">Completamento</div><b>${Math.round(s.completion*100)}%</b></div></div><p class="hint" style="margin-top:12px">${mode==="RIACCENSIONE"?"Riduciamo il carico: oggi conta ripartire.":mode==="ESPANSIONE"?"Stai tenendo un buon ritmo: possiamo alzare leggermente la sfida.":"Ritmo equilibrato: tre azioni piccole e concrete."}</p></section>
<section class="card s6"><h3>📈 Stato dei pilastri</h3><div class="pillars">${pillarHTML()}</div></section><section class="card s6"><h3>💰 Economia</h3><div class="money">€${(ins-out).toFixed(2)}</div><p class="muted">Saldo dei movimenti registrati.</p><button onclick="go('money')">Apri economia →</button></section></div>`}
function tasksPage(){ensureDailyTasks(today());ensureDailyTasks(tomorrow());const future=state.tasks.filter(t=>t.date>today()).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="grid"><section class="card s8"><div class="row"><h2>☑️ Task</h2><button onclick="addTask()">+ Nuova</button></div><p class="muted">Piano di oggi · ${adaptiveMode()}</p>${taskRows(state.tasks.filter(t=>t.date===today()))}<h3 style="margin-top:25px">Prossimi giorni</h3>${future.length?future.map(t=>`<div class="task"><div class="task-title"><b>${esc(t.title)}</b><div class="small muted">${prettyDate(t.date)} · ${esc(t.cat)} · ${t.mins} min</div></div></div>`).join(""):"<div class='empty'>Nessuna task futura.</div>"}</section><section class="card s4"><h3>📌 Statistiche</h3><p>Totali: <b>${state.tasks.length}</b></p><p>Completate: <b>${state.tasks.filter(x=>x.done).length}</b></p><p>Momentum: <b>${momentum()} giorni</b></p><hr><h3>Regola 1.3</h3><p class="muted">Le task automatiche cambiano in base a ritmo, energia, stress e pilastri più deboli.</p></section></div>`}
function progressPage(){const w=weekData(),completion=Math.round(w.reduce((a,x)=>a+(x.total?x.done/x.total:0),0)/7*100);return `<div class="grid"><section class="card s8"><h2>📊 Progressi</h2><p class="muted">La settimana corrente.</p><div class="timeline">${w.map(x=>`<div class="day ${x.done===x.total&&x.total?'good':x.done?'partial':''} ${x.d===today()?'today':''}"><b>${dateObj(x.d).toLocaleDateString('it-IT',{weekday:'short'})}</b><br>${x.done}/${x.total}</div>`).join("")}</div><div style="margin:20px 0"><div class="row"><b>Completamento medio</b><b>${completion}%</b></div><div class="progress"><div class="bar" style="width:${completion}%"></div></div></div>${Object.entries(state.metrics).map(([k,v])=>`<div style="margin:16px 0"><div class="row"><b>${k.toUpperCase()}</b><b>${v}/100</b></div><div class="progress"><div class="bar" style="width:${v}%"></div></div></div>`).join("")}</section><section class="card s4"><h3>🎯 Potenziale Score</h3><div class="xl">${score()}/100</div><p class="muted">50% continuità task · 50% stato dei pilastri.</p><h3>🔥 Momentum</h3><div class="big">${momentum()} giorni</div><button onclick="go('checkin')">Aggiorna check-in →</button></section></div>`}
function moneyPage(){let ins=state.transactions.filter(x=>x.type==="in").reduce((a,x)=>a+x.amount,0),outs=state.transactions.filter(x=>x.type==="out").reduce((a,x)=>a+x.amount,0),balance=ins-outs;return `<div class="grid"><section class="card s8"><div class="row"><h2>💰 Economia personale</h2><button onclick="addTransaction()">+ Movimento</button></div><div class="formgrid"><div><div class="muted">Entrate</div><div class="money positive">€${ins.toFixed(2)}</div></div><div><div class="muted">Uscite</div><div class="money negative">€${outs.toFixed(2)}</div></div></div><hr><h3>Budget del mese</h3><div class="formgrid"><label>Reddito target<input class="input" type="number" value="${state.monthly.incomeTarget||0}" onchange="setMonthly('incomeTarget',this.value)"></label><label>Spese target<input class="input" type="number" value="${state.monthly.expenseTarget||0}" onchange="setMonthly('expenseTarget',this.value)"></label></div><div class="hint">Saldo registrato: <b>€${balance.toFixed(2)}</b>. L'economia entra nel sistema senza sostituire il tuo piano finanziario.</div><hr><h3>Movimenti</h3>${state.transactions.length?state.transactions.slice().reverse().map(x=>`<div class="task"><div class="task-title"><b class="${x.type==="in"?'positive':'negative'}">${x.type==="in'?"+":"−"} €${x.amount.toFixed(2)}</b><div class="small muted">${esc(x.cat)} · ${esc(x.note||"")}</div></div><span>${x.date}</span></div>`).join(""):"<div class='empty'>Nessun movimento registrato.</div>"}</section><section class="card s4"><h3>🎯 Obiettivi economici</h3>${state.goals.filter(g=>g.cat==="Economia").map(g=>`<div style="margin:16px 0"><div class="row"><b>${esc(g.name)}</b><b>${pct(g.current,g.target)}%</b></div><div class="small muted">€${g.current.toFixed(2)} / €${g.target.toFixed(2)}</div><div class="progress"><div class="bar" style="width:${pct(g.current,g.target)}%"></div></div></div>`).join("")}</section></div>`}
function goalsPage(){return `<div class="grid"><section class="card s8"><div class="row"><h2>🎯 Obiettivi</h2><button onclick="addGoal()">+ Obiettivo</button></div>${state.goals.map(g=>`<div class="task"><div class="task-title"><b>${esc(g.name)}</b><div class="small muted">${esc(g.cat)} · €${g.current.toFixed(2)} / €${g.target.toFixed(2)}</div><div class="progress"><div class="bar" style="width:${pct(g.current,g.target)}%"></div></div></div><button onclick="updateGoal(${g.id})">Aggiorna</button></div>`).join("")}</section></div>`}
function checkinPage(){let last=state.checkins[state.checkins.length-1];return `<div class="grid"><section class="card s8"><h2>🌙 Check-in</h2><p class="muted">Il check-in alimenta il piano adattivo dei giorni successivi.</p><form onsubmit="saveCheckin(event)"><label>Umore <b id="moodv">5</b>/10</label><input class="input" type="range" min="1" max="10" value="5" id="mood" oninput="moodv.textContent=this.value"><label>Energia <b id="energyv">5</b>/10</label><input class="input" type="range" min="1" max="10" value="5" id="energy" oninput="energyv.textContent=this.value"><label>Stress <b id="stressv">5</b>/10</label><input class="input" type="range" min="1" max="10" value="5" id="stress" oninput="stressv.textContent=this.value"><label>Ore di sonno</label><input class="input" type="number" step=".1" id="sleep" value="5"><label>Tempo telefono (ore)</label><input class="input" type="number" step=".1" id="phone" value="8"><label>Fumo</label><input class="input" id="smoke" placeholder="es. 2 sigarette"><label>Ostacolo principale</label><select class="input" id="obstacle"><option>nessuno</option><option>ansia</option><option>telefono</option><option>stanchezza</option><option>fumo</option><option>mancanza di tempo</option><option>mancanza di motivazione</option><option>altro</option></select><button type="submit">Salva check-in</button></form></section><section class="card s4"><h3>Ultimo check-in</h3>${last?`<p>${last.date}</p><p>Umore: ${last.mood}/10</p><p>Energia: ${last.energy}/10</p><p>Stress: ${last.stress}/10</p><p>Sonno: ${last.sleep}h</p><p class="small muted">Modalità successiva: ${adaptiveMode()}</p>`:"<p class='muted'>Ancora nessun dato.</p>"}</section></div>`}
function openPage(){return `<div class="grid"><section class="card s8"><div class="row"><h2>📋 Cose aperte</h2><button onclick="addOpen()">+ Aggiungi</button></div>${state.openItems.map((x,i)=>`<div class="task"><button class="check" onclick="resolveOpen(${i})">✓</button><div class="task-title"><b>${esc(x)}</b><div class="small muted">Aperto</div></div><button onclick="makeTask(${i})">→ Task</button></div>`).join("")||"<div class='empty'>Nessuna cosa aperta. Ottimo.</div>"}</section></div>`}
function render(){renderNav();content.innerHTML={oggi:home,task:tasksPage,progressi:progressPage,money:moneyPage,obiettivi:goalsPage,checkin:checkinPage,aperte:openPage}[page]()}

function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;save();render()}
function deleteTask(id){if(!confirm("Eliminare questa task?"))return;state.tasks=state.tasks.filter(x=>x.id!==id);save();render()}
function addTask(){const title=prompt("Nome task:");if(!title)return;const mins=Number(prompt("Minuti stimati:","10"))||10;state.tasks.push({id:Date.now(),title,cat:"Generale",mins,done:false,date:today(),auto:false});save();render()}
function quickAdd(){const x=prompt("1 = task | 2 = movimento | 3 = cosa aperta");if(x==="1")addTask();else if(x==="2")addTransaction();else if(x==="3")addOpen()}
function addTransaction(){const amount=Number(prompt("Importo €:"));if(!amount)return;const type=confirm("È un'entrata? OK=sì, Annulla=uscita")?"in":"out",cat=prompt("Categoria:","Altro")||"Altro",note=prompt("Nota:","")||"";state.transactions.push({id:Date.now(),amount,type,cat,note,date:today()});save();render()}
function setMonthly(k,v){state.monthly[k]=Number(v)||0;save()}
function addGoal(){const name=prompt("Nome obiettivo:");if(!name)return;const target=Number(prompt("Target €:","1000"))||1000;state.goals.push({id:Date.now(),name,target,current:0,cat:"Personale"});save();render()}
function updateGoal(id){const g=state.goals.find(x=>x.id===id),v=Number(prompt("Valore attuale:",g.current));if(!isNaN(v)){g.current=Math.max(0,v);save();render()}}
function addOpen(){const x=prompt("Cosa hai da fare/risolvere?");if(x){state.openItems.push(x);save();render()}}
function resolveOpen(i){state.openItems.splice(i,1);save();render()}
function makeTask(i){const title=state.openItems[i];state.tasks.push({id:Date.now(),title,cat:"Cose aperte",mins:10,done:false,date:today(),auto:false});state.openItems.splice(i,1);save();render()}
function saveCheckin(e){e.preventDefault();state.checkins.push({date:today(),mood:+mood.value,energy:+energy.value,stress:+stress.value,sleep:+sleep.value,phone:+phone.value,smoke:smoke.value,obstacle:obstacle.value});save();alert("Check-in salvato. Da ora il motore userà questi dati per adattare le prossime task.");render()}
function resetData(){if(confirm("Resetta tutti i dati locali?")){localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);location.reload()}}
function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),appVersion:VERSION},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="potenziale-backup-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(){const input=document.createElement("input");input.type="file";input.accept="application/json";input.onchange=async()=>{try{const data=JSON.parse(await input.files[0].text());if(!data.tasks||!data.profile)throw 0;state=normalize(data);save();render();alert("Backup ripristinato.")}catch{alert("File non valido.")}};input.click()}

render();
</script>
<script>
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
let deferredInstall=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;installBtn.classList.add("show")});installBtn?.addEventListener("click",async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;installBtn.classList.remove("show")});window.addEventListener("appinstalled",()=>installBtn.classList.remove("show"));
</script></body></html>
